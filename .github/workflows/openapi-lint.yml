name: OpenAPI Lint

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi-lint:
    name: openapi-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml --config redocly.yaml
